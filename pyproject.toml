[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "harness"
version = "0.1.0"
description = "Веха 0: инфраструктура записи и воспроизведения опыта. Без ИИ."
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
# Платформенные backend'ы. Ставятся только там, где реально нужны:
# без них соответствующий backend честно отказывается работать, а не подсовывает
# правдоподобные данные.
linux = ["mss>=9", "evdev>=1.6", "sounddevice>=0.4"]
# mss стоит и здесь, и в macos: она кроссплатформенна, а dxcam и ScreenCaptureKit
# не написаны. Без mss оператор на Windows и macOS не мог записать ничего, хотя
# рабочий путь был на месте — его запирала не машинерия, а проверка переменной
# DISPLAY, которой на этих системах не бывает.
windows = ["mss>=9", "dxcam>=0.0.5", "sounddevice>=0.4"]
macos = ["mss>=9", "sounddevice>=0.4"]
# Плотный оптический поток. Единственная тяжёлая зависимость в проекте, поэтому
# отдельным extras: без неё дальность по потоку честно отказывается считаться
# (FlowUnavailable), а не считается чем-нибудь другим молча.
flow = ["opencv-python-headless>=4.9"]
# matplotlib нужен не «для картинок вообще», а для того, чтобы прогон тестов был
# зелёным на чистой установке: сборку фикстуры панели зовут два теста
# (`test_panel_server`), и без него они падают на пустом месте. Числа при этом
# целы — падает зеркало, а не замер, — но тест об этом не знает и краснеет.
dev = ["pytest>=8", "opencv-python-headless>=4.9", "matplotlib>=3.8"]

[project.scripts]
harness = "harness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]
